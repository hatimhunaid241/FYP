# HKTVmall Semantic Search Configuration
# ============================================================
# Central config — all scripts read from here.
#
# ARCHITECTURE (per-keyword):
#   Each keyword is treated as an independent pipeline.
#   Products, embeddings, and clusters are stored under
#   data/processed/<keyword>/ so that:
#     - Clustering is done on the ~1000 results for THAT keyword only
#     - At search time the user's query maps to one keyword bucket
#     - Results are presented as labelled clusters of that keyword
# ============================================================

# ── Data Collection ──────────────────────────────────────────
data_collection:
  products_per_keyword: 1000     # ~1 000 products per keyword
  api_delay_seconds: 0.5         # polite rate-limiting
  save_raw_responses: false      # set true to keep raw JSON pages

# ── Keywords ─────────────────────────────────────────────────
# 20 semantically-ambiguous bilingual keywords.
# Each keyword gets its own collection + clustering pipeline.
keywords:
  seed_keywords:
    # Electronics / tech
    - "apple"         # fruit  OR  Apple Inc.
    - "samsung"
    - "xiaomi"
    - "speaker"
    - "battery"
    - "charger"
    - "fan"           # cooling fan  OR  handheld fan
    - "camera"
    - "headphone"
    - "cable"
    # Food / household
    - "milk"
    - "oil"           # cooking  OR  essential  OR  motor
    - "mask"          # face mask (beauty)  OR  surgical mask
    - "tea"
    - "coffee"
    # Health / beauty
    - "cream"         # skincare  OR  food cream
    - "vitamin"
    - "protein"
    # General / ambiguous
    - "brush"         # makeup  OR  toothbrush  OR  paint
    - "bag"

# ── Text Preprocessing ───────────────────────────────────────
preprocessing:
  english:
    lowercase: true
    remove_stopwords: false
  chinese:
    segmentation: "jieba"
    traditional_to_simplified: true
    remove_stopwords: false

# ── Embeddings ───────────────────────────────────────────────
embeddings:
  # Multilingual model — handles EN + ZH queries and products.
  model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  batch_size: 64
  normalize_embeddings: true
  use_gpu: true

# ── Clustering (per-keyword) ─────────────────────────────────
clustering:
  kmeans:
    # auto_k: sweep k_min..k_max per keyword, pick best silhouette.
    auto_k: true
    k_min: 2
    k_max: 15          # upper bound kept low — each keyword has ~1 000 products
    n_clusters: 5      # fallback when auto_k is false
    random_state: 42
    max_iter: 300
    n_init: 10

# ── Search ───────────────────────────────────────────────────
search:
  top_k_results: 10
  similarity_metric: "cosine"
  # Cluster-label boost: tiny tie-breaker, does NOT dominate cosine score
  cluster_label_boost: true
  cluster_label_weight: 0.05

# ── Evaluation ───────────────────────────────────────────────
evaluation:
  top_k: 10

# ── File Paths ───────────────────────────────────────────────
# Root directories — per-keyword artefacts live under processed_dir/<keyword>/
paths:
  raw_dir:            "data/raw"
  processed_dir:      "data/processed"   # per-keyword subdirs created here
  results_dir:        "results"
  logs_dir:           "logs"

  # Per-keyword filename templates (keyword slug substituted at runtime)
  # These are used by helper function keyword_paths() in config_loader.py
  kw_products_parquet:        "products.parquet"
  kw_embeddings_npy:          "product_embeddings.npy"
  kw_embeddings_parquet:      "products_with_embeddings.parquet"
  kw_clusters_csv:            "kmeans_clusters.csv"
  kw_clusters_labeled_csv:    "clusters_labeled.csv"
  kw_cluster_labels_csv:      "cluster_labels.csv"
  kw_elbow_plot:              "kmeans_elbow.png"

# ── Logging ──────────────────────────────────────────────────
logging:
  level: "INFO"
  log_file: "logs/pipeline.log"

# ── Reproducibility ──────────────────────────────────────────
random_seed: 42
